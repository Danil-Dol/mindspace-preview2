<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Раздел недоступен — Психолог Вероника Косцова</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="img/new_icons/icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="img/new_icons/apple-touch-icon.png">
<style>
:root{--bg:#F7F9FC;--surface:#fff;--text:#1D2733;--text2:#5A6B7B;--border:#E3E9F0;--blue:#2F7BE0;--teal:#27B9BF}
@media (prefers-color-scheme:dark){:root{--bg:#10161D;--surface:#18212B;--text:#EAF0F6;--text2:#A6B4C2;--border:#27323E}}
@font-face{font-family:'Golos Text';font-weight:400;src:url(fonts/GolosText-Regular.ttf) format('truetype');font-display:swap}
@font-face{font-family:'Golos Text';font-weight:500;src:url(fonts/GolosText-Medium.ttf) format('truetype');font-display:swap}
@font-face{font-family:'Golos Text';font-weight:600;src:url(fonts/GolosText-SemiBold.ttf) format('truetype');font-display:swap}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--text);
font-family:'Golos Text',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;line-height:1.55}
.wrap{width:100%;max-width:640px;text-align:center}
.brand{display:inline-flex;align-items:center;gap:12px;margin-bottom:28px;text-decoration:none;color:inherit}
.brand img{width:44px;height:44px}.brand span{font-weight:600;font-size:18px}
h1{font-size:clamp(24px,5vw,32px);line-height:1.2;margin:0 0 12px;font-weight:600}
p{color:var(--text2);margin:0 0 14px;font-size:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:28px 0 22px;text-align:left}
.card{display:block;padding:22px;border-radius:20px;background:var(--surface);border:1px solid var(--border);text-decoration:none;color:inherit;
transition:transform .15s,box-shadow .15s}
.card:hover,.card:focus-visible{transform:translateY(-2px);box-shadow:0 8px 24px rgba(30,50,80,.12)}
.card:focus-visible,.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.card b{display:block;font-size:20px;margin-bottom:4px}.card small{display:block;color:var(--text2);font-size:14px}
.card .n{display:inline-block;margin-top:12px;font-size:13px;font-weight:600;color:var(--blue)}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:22px}
.btn{display:inline-block;padding:12px 22px;border-radius:14px;background:var(--blue);color:#fff;text-decoration:none;font-weight:600}
.btn.alt{background:transparent;color:var(--blue);border:1.5px solid var(--border)}
.note{margin-top:26px;font-size:13.5px;color:var(--text2)}
</style>
</head>
<body>
<main class="wrap">
<a class="brand" href="index.html"><img src="img/logo.svg" alt=""><span>Психолог Вероника Косцова</span></a>

<h1>Раздел недоступен</h1>
<p>Этот раздел сайта пока не открыт: в этой версии доступны только <b>Вики</b> и <b>Тесты</b>.</p>
<div class="btns"><a class="btn" href="wiki.html">Открыть Вики</a><a class="btn alt" href="tests.html">Открыть Тесты</a></div>
<p class="note"><a href="index.html" style="color:inherit">← На стартовую страницу</a></p>

</main>
</body>
</html>
